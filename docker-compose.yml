services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banklite
      POSTGRES_USER: banklite
      POSTGRES_PASSWORD: banklite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklite -d banklite"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/banklite
      DB_USER: banklite
      DB_PASSWORD: banklite
      REDIS_HOST: redis
    ports:
      - "8080:8080"
