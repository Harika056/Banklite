spring:
  application:
    name: banklite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banklite}
    username: ${DB_USER:banklite}
    password: ${DB_PASSWORD:banklite}
  jpa:
    open-in-view: false
    hibernate:
      # Convenient for a portfolio project. A real system would use Flyway/Liquibase migrations.
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

banklite:
  cache:
    accounts-ttl-seconds: 60
  transfer:
    retry-backoff-ms: 10
